services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress-test
      MARIADB_ROOT_PASSWORD: root-test
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - arvan_db_data:/var/lib/mysql
  wordpress:
    image: wordpress:6.8.2-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-test
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - arvan_wp_data:/var/www/html
      - ../arvan-reseller:/var/www/html/wp-content/plugins/arvan-reseller:ro
  cli:
    image: wordpress:cli-php8.2
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-test
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - arvan_wp_data:/var/www/html
      - ../arvan-reseller:/var/www/html/wp-content/plugins/arvan-reseller:ro
      - ./:/arvan-tests:ro
volumes:
  arvan_db_data:
  arvan_wp_data:
